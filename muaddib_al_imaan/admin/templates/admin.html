<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muaddin-al-imaan — Admin</title>
    <link rel="stylesheet" href="/static/css/chat_widget.css">
    <style>
        .admin-panel {
            padding: 16px;
            background: #f9f9f9;
            border-bottom: 1px solid #eee;
        }
        .admin-panel form {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .admin-panel input, .admin-panel select {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        .admin-panel button {
            padding: 10px;
            background: #00008b;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        #book-list {
            padding: 16px;
            overflow-y: auto;
        }
        .book-item {
            background: white;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }
        .book-item .status {
            font-size: 0.8rem;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <div id="chat-container" style="max-width: 700px;">
        <div class="chat-header">
            <h2>Muaddin-al-imaan — Admin</h2>
        </div>

        <div class="admin-panel">
            <h3>Upload Book</h3>
            <form id="upload-form" enctype="multipart/form-data">
                <input type="text" name="book_name" placeholder="Book Name" required>
                <input type="text" name="author_name" placeholder="Author / Imam name" required>
                <select name="fiqha" required>
                    {% for fiqha in fiqhas %}
                    <option value="{{ fiqha }}">{{ fiqha }}</option>
                    {% endfor %}
                </select>
                <input type="number" name="rank" placeholder="Rank (higher = higher priority)" value="0">
                <input type="file" name="file" accept=".txt,.pdf,.docx" required>
                <button type="submit">Upload & Embed</button>
            </form>
        </div>

        <div id="book-list">
            <h3>Books</h3>
            <div id="books"></div>
        </div>
    </div>
    <script src="/static/js/admin.js"></script>
</body>
</html>
